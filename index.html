<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpusWeb — Browser Music Notation &amp; Score Editor</title>
    <meta name="description" content="Browser-based MuseScore-compatible music notation editor with local file import, web link loading, SVG engraving, and polyphonic audio playback." />
    <meta property="og:title" content="OpusWeb — Browser Music Notation &amp; Score Editor" />
    <meta property="og:description" content="Browser-based MuseScore-compatible music notation editor with local file import, web link loading, SVG engraving, and polyphonic audio playback." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var savedTheme = localStorage.getItem('opusweb_theme_v1');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
